<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATELIER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css">

</head>
<body>
    <header class="main-header">
        <nav class="nav-links">
            <a href="#shop">SHOP</a>
            <a href="#categories">CATEGORIES</a>
            <a href="#about">ABOUT</a>
        </nav>
        <div class="logo">
            <h1>ATELIER</h1>
        </div>
        <div class="header-icons">
            <span class="fa-solid fa-search"></span>
            <span class="fa-regular fa-heart"></span>
            <span class="fa-solid fa-cart-shopping"></span>
            <span class="fa-regular fa-user"></span>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <p class="subtitle">NEW COLLECTION </p>
                <h2>Timeless Style</h2>
                <button> EXPLORE COLLECTION</button>
            </div>
        </section>   
        
        <aside class="promo-bar">
            <p>Complimentary global shipping and returns on all orders over $300</p>
        </aside>

        <section class="mosaic-gallery">
            <div class="gallery-item large-left">
                <img src="mosaic1.png" alt="Folded Sweaters">
            </div>
            <div class="gallery-item top-right">
                <img src="mosaic2.png" alt="Shirts">
            </div>
            <div class="gallery-item bottom-right">
                <img src="mosaic3.png" alt="Jeans">
            </div>
        </section>
               
    </main>

</body>
</html>
